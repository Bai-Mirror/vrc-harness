# =============================================================================
# harness.nymiro.moe: Avatar Harness product site, release downloads and the harness-server API
# =============================================================================
# Installed as /docker/nginx-nymiro/conf/harness.nymiro.moe.conf (conf.d is included inside http{}). It replaces the
# placeholder `server_name harness.nymiro.moe` block in default.conf, which must be deleted in the same change: with
# two blocks for one name nginx warns and serves only the first. Steps and rollback: deploy/README.md.
#
# The nginx-nymiro container needs two read-only mounts:
#   /docker/harness-server/site          -> /srv/harness/site        static site, synced from site/ of the repository
#   /docker/harness-server/data/releases -> /srv/harness/releases    release manifests and downloads
#
# Limits: POST /v1/contributions 6 requests a minute per IP (burst 3) with a 90m body, which is 64 MiB of files once
# base64-encoded; the rest of /v1/ 5 requests a second per IP (burst 10); 10 concurrent requests per IP on /v1/ and
# 32 on the static site (under HTTP/2 each concurrent request counts as one, and a product page loads a dozen images
# at once); 16k request bodies everywhere else.
# Logs: no query strings (a client could put a user name there), no request bodies, no referrers. The contribution
# endpoint is logged without the client address: the server promises contributors it does not record one. Limited
# requests and missing files stay out of the error log, which would name the address and the full request line.

limit_req_zone  $binary_remote_addr zone=harness_contrib:10m rate=6r/m;
limit_req_zone  $binary_remote_addr zone=harness_api:10m     rate=5r/s;
limit_conn_zone $binary_remote_addr zone=harness_conn:10m;

log_format harness_site '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent $request_time "$http_user_agent" host=$host';
log_format harness_anon '- [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent $request_time host=$host';

server {
    listen 443 ssl;
    http2 on;
    server_name harness.nymiro.moe;

    ssl_certificate     /etc/letsencrypt/live-nymiro/nymiro.moe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live-nymiro/nymiro.moe/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Real visitor addresses behind Cloudflare, so the per-IP limits count visitors and not Cloudflare edges.
    include /etc/nginx/conf.d/cloudflare-realip.inc;

    # Every location below leaves add_header alone, so these reach every response.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "DENY" always;

    access_log /var/log/nginx/access.log harness_site;

    # Locations under /v1/ set their own, lower limit (a limit_conn in a location replaces this one).
    limit_conn        harness_conn 32;
    limit_conn_status 429;
    limit_req_status  429;
    client_max_body_size 16k;

    # The image's error log runs at notice: at info, rejections (still 429 in the access log) and missing files
    # leave no client address or query string there.
    limit_req_log_level  info;
    limit_conn_log_level info;
    log_not_found        off;

    root  /srv/harness/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Hidden files are never part of the site.
    location ~ /\. {
        return 404;
    }

    # The API. A variable proxy_pass is resolved per request (01-resolver.conf), so a stopped harness-server means
    # 502 on /v1/ only, never an nginx that refuses to load. Only the headers the API consumes are forwarded;
    # arbitrary incoming address, cookie and fingerprint headers must not reach the upstream.
    location /v1/ {
        limit_conn harness_conn 10;
        limit_req zone=harness_api burst=10 nodelay;
        # Covers trailing slashes and future API paths as well as today's dedicated collaboration routes.
        access_log /var/log/nginx/access.log harness_anon;
        set $upstream_harness http://harness-server:8080;
        proxy_pass $upstream_harness$request_uri;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Content-Type      $http_content_type;
        proxy_set_header Accept            $http_accept;
    }

    # Installation registration is open, but each installation gets a different token. Limit registrations by source
    # address without retaining that address in the access log. The upstream never receives forwarded client addresses.
    location = /v1/installations {
        limit_conn harness_conn 10;
        limit_req zone=harness_contrib burst=3 nodelay;
        access_log /var/log/nginx/access.log harness_anon;
        set $upstream_harness http://harness-server:8080;
        proxy_pass $upstream_harness$request_uri;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Content-Type      $http_content_type;
        proxy_set_header Accept            $http_accept;
    }

    location ~ ^/v1/(records|contributions/status|consents/revoke)$ {
        limit_conn harness_conn 10;
        limit_req zone=harness_api burst=10 nodelay;
        access_log /var/log/nginx/access.log harness_anon;
        set $upstream_harness http://harness-server:8080;
        proxy_pass $upstream_harness$request_uri;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Content-Type      $http_content_type;
        proxy_set_header Accept            $http_accept;
    }

    location = /v1/contributions {
        limit_conn harness_conn 10;
        limit_req zone=harness_contrib burst=3 nodelay;
        client_max_body_size 90m;
        client_body_timeout  60s;
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;
        access_log /var/log/nginx/access.log harness_anon;
        set $upstream_harness http://harness-server:8080;
        proxy_pass $upstream_harness$request_uri;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Content-Type      $http_content_type;
        proxy_set_header Accept            $http_accept;
    }

    # Downloads straight from the data volume. Their integrity comes from the signed manifests, not from nginx;
    # every file goes out as an opaque download, whatever its extension.
    location ^~ /v1/releases/files/ {
        limit_conn harness_conn 10;
        limit_req zone=harness_api burst=10 nodelay;
        alias /srv/harness/releases/app/files/;
        types { }
        default_type application/octet-stream;
        location ~ /\. {
            return 404;
        }
    }

    location ^~ /v1/knowledge/files/ {
        limit_conn harness_conn 10;
        limit_req zone=harness_api burst=10 nodelay;
        alias /srv/harness/releases/knowledge/files/;
        types { }
        default_type application/octet-stream;
        location ~ /\. {
            return 404;
        }
    }
}
