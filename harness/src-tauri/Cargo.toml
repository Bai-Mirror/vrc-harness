[package]
name = "avatar-harness-desktop"
version = "0.1.0-dev.1"
description = "Harness desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
# The system file and folder picker: locations are chosen, never typed (the GUI's gui/src/picker.ts). The same version
# as @tauri-apps/plugin-dialog in package.json.
tauri-plugin-dialog = "2.8.0"
getrandom = "0.3"
futures-channel = "0.3"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_20"] }
soup3 = "0.5"

# The versions Tauri's WebView2 runtime (wry) is built with, so the controller it hands out is the same type.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
dunce = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
