milestones:
  # package 的 needs 链已覆盖全部前序 stage，故只要求到 package 为止；
  # 上传（sdk_upload）与客户端实测（client_test）发生在 UPLOAD_READY 之后，写成 CLIENT_VERIFIED 的 Gate。
  - id: UPLOAD_READY
    requires_stages: [package]
    evidence_on: delivery_package
  - id: CLIENT_VERIFIED
    after: UPLOAD_READY
    gates: [sdk_upload, client_test]
