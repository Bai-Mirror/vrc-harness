  - id: recolor_layer_local
    observe: material.recolor
    "on": materials
    scope: edit
    # 局部性由观察器自己算：把产物与原图相减，变化必须全部落在蒙版内。蒙版由执行器写出但**核对了哈希**，
    # 所以它不能事后换成另一个形状来把越界改动掩盖掉。
    rule: "layer_outside_mask_changed == 0"
    severity: blocking
    maturity: accepted
    source: "决定记录/D-75"
    kind: spec
    asserted_by: compile:legacy
