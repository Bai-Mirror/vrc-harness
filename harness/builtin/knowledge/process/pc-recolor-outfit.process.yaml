# 流程定义：PC 改色 + 换衣（一类订单，与具体素体/服装/配色无关）
# 格式：合同/流程定义格式_v0.1.md（冻结稿 + v0.1.1 补遗）。字段只用该页列出的。
# 阈值数值不写在这里，全部以 t.* 引用 thresholds.yaml。
# source 的提交号＝编译当时的 git rev-parse --short HEAD。
# 优化与回归两轮：build_pre/regression_pre（未优化基线）→ optimize → build/regression（优化后）；
# performance 读 build_pre 报告（基线）与 build 报告（优化后）做前后对比，不另取基线。
# v0.1.3（2026-09-27 用户拍板）：方案阶段 8 条选型图鉴检查加 when: plan.client_gallery——方案声明用客户图鉴挑件时才适用，否则记不适用（绑定方案哈希）。
schema: process/0.1
id: pc-recolor-outfit
