    verification: [{kind: harness-regression, ref: test/recolor-region.test.ts}]
  - id: recolor_region_alpha_preserved
    observe: material.recolor
    "on": materials
    scope: edit
    rule: "region_alpha_moved == 0"
    severity: blocking
    maturity: accepted
    source: "决定记录/D-117"
    kind: spec
    asserted_by: compile:legacy
    verification: [{kind: harness-regression, ref: test/recolor-region.test.ts}]
  - id: recolor_region_semantics
    observe: material.recolor
    "on": materials
    scope: edit
    # 区域使用二值 UV 足迹；flat 直接写目标色，shade 用双精度算出「目标色 ×（本像素最亮通道 ÷ 目标色最亮通道）」
    # 后按 floor(x + 0.5) 逐通道取整。按层路线的软遮罩混合仍使用 NumPy .round()，不能混用取整规则。
    # 与按层同一套语义判据，但**逐像素算出该语义应当产生的颜色**再比，不数通道值：flat 是目标色，
    # shade 是「目标色 ×（本像素最亮通道 ÷ 目标色最亮通道）」。数「有几种通道值」既放过没改过色的渐变，
    # 也误拒一个正确的纯色区域（R6 第 6 项）。
    rule: "region_semantics_violations == 0"
    severity: blocking
    maturity: accepted
    source: "决定记录/D-117/D-75"
    kind: spec
    asserted_by: compile:legacy
    verification: [{kind: harness-regression, ref: test/recolor-region.test.ts}]
  - id: recolor_region_bound
    observe: material.recolor
    "on": materials
    scope: edit
    # 读材质资产里的贴图属性，不是读台账：产物必须真的被绑到槽位上。优先使用
    # MeasureMaterialTargets → MaterialTargetReadback 对最终变体的实际 Renderer／槽／材质／贴图集合，
    # 并核对方案与依赖文件哈希；槽位按完整身份核对。只比槽号与材质，会让「同一槽号、同一材质、
    # 另一个渲染器」的覆盖项读成声明的那块表面（R6b 第 2 项）。没有独立回读的旧记录只能输出 YAML 诊断，不能放行。
    rule: "region_bindings_missing == 0"
    severity: blocking
    maturity: accepted
    source: "决定记录/D-117"
    kind: spec
    asserted_by: compile:legacy
    verification: [{kind: harness-regression, ref: test/recolor-region.test.ts}]
  - id: recolor_region_record_matches
    observe: material.recolor
    "on": materials
    scope: edit
    # 执行记录不能自己定义要核对的东西。需求集合、渲染器、子网格、骨骼、颜色、语义全部以批准方案为准，
    # 逐操作比对；重复、遗漏与额外的记录都算不符。少了这一条，把记录和产物一起改成另一个区域仍然全过。
    rule: "region_record_mismatches == 0"
    severity: blocking
    maturity: accepted
    source: "决定记录/D-117"
    kind: spec
    asserted_by: compile:legacy
    verification: [{kind: harness-regression, ref: test/recolor-region.test.ts}]
  - id: recolor_region_transparent_untouched
    observe: material.recolor
    "on": materials
    scope: edit
    # 全透明像素没有颜色可改：那里没有表面。改了它，产物就与原件在什么都没画的地方不同，读数也不再是
    # 「区域变了色」。区域全是透明像素时这条与语义判据一起阻断，而不是只留一条 note。
    rule: "region_transparent_rgb_changed == 0"
    severity: blocking
    maturity: accepted
    source: "决定记录/D-117"
    kind: spec
    asserted_by: compile:legacy
    verification: [{kind: harness-regression, ref: test/recolor-region.test.ts}]
  - id: recolor_region_write_isolated
    observe: material.recolor
    "on": materials
    scope: edit
    # 归属是逐块表面算出来的：两组区域各写同一张源贴图时，两组区域的并集没有任何一方证明过。先阻断。
