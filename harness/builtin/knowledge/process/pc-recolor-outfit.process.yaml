    scope: edit
    # 两个区域都覆盖的像素没有唯一归属，两边都不许上色——给它上任何一种颜色都会把一只眼染到另一只。
    # 局部性查不出这一条：那个像素在两个区域内部。所以观察器分开数「所有区域之外」与「在某区域足迹内、
