checks:
  - id: face_input_integrity
    observe: face.input
    on: face
    scope: edit
    rule: "face_input_bound == true"
    severity: blocking
    maturity: accepted
    kind: spec
    asserted_by: compile:managed-face
    verification: [{kind: harness-regression, ref: test/workflow/input-runtime.test.ts}]
  - id: plan_inputs_ready
    observe: plan.inputs
    on: assets
    scope: edit
    rule: "plan_input_catalog_ready == true"
    severity: blocking
    maturity: accepted
    kind: spec
    asserted_by: compile:managed-plan
    verification: [{kind: harness-regression, ref: test/plan-tool.test.ts}]
  - id: plan_source_contract
    observe: plan.source
    on: plan
    scope: edit
    rule: "plan_source_contract_valid == true"
    severity: blocking
    maturity: accepted
    kind: spec
    asserted_by: compile:managed-plan
    verification: [{kind: harness-regression, ref: test/plan-tool.test.ts}]
  - id: plan_layer_paths_resolvable
    observe: plan.source
    "on": plan
    scope: edit
    # A layered target names a region inside the vendor's own file, and one plan named five such paths that
    # were all invented and still passed its gate. The metric is emitted only when the layer tables could
    # actually be read; when they could not, the engine sees no data and no data does not pass. That is the
    # line between drafting on a machine without the library and presenting the plan as checked (D-100).
    rule: "plan_layer_paths_unresolved == 0"
    severity: blocking
    maturity: accepted
    source: "决定记录/D-100"
    kind: spec
    asserted_by: compile:managed-plan
    verification: [{kind: harness-regression, ref: test/plan-layer-targets.test.ts}]
  - id: face_candidates_integrity
    observe: face.candidates
    on: face_candidates
    scope: edit
    rule: "face_candidates_valid == true and face_candidate_preview_integrity == true"
    severity: blocking
    maturity: accepted
    kind: spec
    asserted_by: compile:managed-face
    verification: [{kind: harness-regression, ref: test/face-preview.test.ts}]
  - id: face_output_integrity
    observe: face.apply
    on: face
    scope: edit
    rule: "face_source_preserved_valid == true or face_geometry_valid == true"
    severity: blocking
    maturity: accepted
    kind: spec
    asserted_by: compile:managed-face
    verification: [{kind: harness-regression, ref: test/face-stage.test.ts}]
  - id: face_runtime_integrity
    observe: face.apply
    on: face
    scope: edit
    rule: "face_source_preserved_valid == true or face_runtime_bindings_valid == true"
    severity: blocking
    maturity: accepted
    kind: spec
    asserted_by: compile:managed-face
    verification: [{kind: harness-regression, ref: test/face-stage.test.ts}]
  - id: face_production_qualification
    observe: face.apply
    on: face
    scope: edit
    rule: "face_source_preserved_valid == true or (face_expression_compensation_valid == true and face_damage_smoothness_measured == true and face_eye_exposure_measured == true)"
    severity: blocking
    maturity: accepted
    kind: spec
    asserted_by: compile:managed-face
    verification: [{kind: harness-regression, ref: test/face-stage.test.ts}]
  - id: environment_lock_consistent
    observe: environment.verify
    on: environment
    scope: edit
    rule: "environment_consistent == true"
    severity: blocking
    maturity: accepted
    source: "docs/zh/设计/1-整体架构/目标架构与联通合同.md:C"
    kind: spec
    asserted_by: compile:design-reachability-20260930
    verification:
      - kind: harness-regression
        ref: test/managed-environment.test.ts
