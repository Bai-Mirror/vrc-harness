  - id: recolor_layer_semantics
    observe: material.recolor
    "on": materials
    scope: edit
    # 按层目标使用作者的软遮罩：先按遮罩权重混合原像素与语义产出的像素，再保留现有 NumPy .round() 的 8 bit 取整。
    # 这条路线不套用按网格区域的 floor(x + 0.5)；两条路线的边界结果必须分别保持。
    # 按该目标声明的语义核对，不混用，也**不数通道值**：flat 要求蒙版内可见像素精确等于目标色；
    # shade 要求它们等于「目标色 ×（本像素最亮通道 ÷ 目标色最亮通道）」。原像素最大通道等于目标色最大
    # 通道时，乘原像素的写法要求的正是原样不动，会把没改过色的区域读成正确的 shade（R6b 第 1 项）。
    rule: "layer_semantics_violations == 0"
    severity: blocking
    maturity: accepted
    source: "决定记录/D-75"
    kind: spec
