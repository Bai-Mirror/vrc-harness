  - id: fixed_outfits_installed
    observe: clothing.install
    "on": outfits
    scope: edit
    rule: "fixed_outfit_state_failures == 0"
    severity: blocking
    maturity: accepted
    source: "builtin/tools/harness/unity/Editor/OutfitStage.cs"
    verification:
      - kind: harness-regression
        ref: test/fixed-outfits-unity.test.ts

  # D-138: the blocking check follows what is actually visible after assembly, not only what the plan
  # declared. Two visible parts sharing a same-position surface (A_mutual >= t.overlap_contact_min_cm2 at
  # t.overlap_contact_epsilon_mm) are one pile the executor has to decide once. A measurement that did not
  # run leaves the counter absent, which is no_data and never a pass.
  - id: outfit_visible_overlaps
    observe: clothing.install
    "on": outfits
    scope: edit
    rule: "visible_overlap_pairs == 0"
    severity: blocking
    maturity: accepted
    source: "决定记录/D-138；车道报告 OV1-stacked-meshes.md §4"
    kind: spec
    asserted_by: compile:harness-core
    verification:
      - kind: harness-regression
        ref: test/outfit-visibility-unity.test.ts

  # D-143 (GI1): the orderer's direction is that the edge cases cannot be enumerated, so the Runtime does not
  # decide whether a visible garment-through-garment interpenetration is acceptable — it presents the evidence for
  # every pair the picture confirmed above the noise gate and REQUIRES the executor's decision (close / accept /
  # ask_user), and it blocks the two ways that can go wrong: a pair with no valid decision, and a pair outside the
  # two coarse guard bounds (t.visible_interpenetration_guard_vertices / _guard_depth_mm) that was accepted
  # anyway. The counter is the sum of those two classes. A measurement that did not finish (no render
  # confirmation, an over-cap candidate set) leaves the counter absent, which is no_data and never a pass.
  - id: outfit_visible_interpenetration
    observe: clothing.install
    "on": outfits
    scope: edit
    rule: "visible_interpenetration_pairs == 0"
    severity: blocking
    maturity: accepted
    source: "决定记录/D-143；车道报告 GI1-visible-interpenetration.md"
    kind: spec
    asserted_by: compile:harness-core
    verification:
      - kind: harness-regression
        ref: test/outfit-visibility-unity.test.ts

  # The pairs the executor kept and handed to the user (`ask_user`, `D-143` ③) are a non-blocking observation
  # (`visible_interpenetration_ask_user`), not a check: a rule of `>= 0` can never fail, so it carried no
  # information while looking like a gate. The count stays in the reading and the delivery note still renders
  # those pairs from the receipt's `interpenetration_decisions`.

