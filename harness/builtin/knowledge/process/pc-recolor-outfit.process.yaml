  - id: recolor_region_ambiguity_reported
    observe: material.recolor
    "on": materials
    scope: edit
    # 两个区域共有的像素数必须被报出来，哪怕它是 0：这个数就是「左右两边在这张贴图上能不能分开」的读数，
    # 报不出来时后面的人无法判断一次异色瞳是靠区域分色做成的，还是靠猜的。缺这个指标时规则拿到的是
