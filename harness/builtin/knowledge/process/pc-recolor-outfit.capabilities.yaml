    goal: 修复优化前回归发现的实际功能或几何缺陷；只修改源工程派生层。Provider 退出后 Harness 会强制刷新隔离构建副本，再由 Runtime 独立重建并测量。没有失败证据时只核对正式状态集，不得凭空改造审美设计。
    maxRetries: 2
    maxCheckRetries: 3
    prepareCommand: [python3, "{toolRoot}/harness/build_copy.py", --slot, regression_pre]
    allowedWrites: [Assets/_Harness/Outfit/, Assets/_Harness/Outfit.meta, Assets/_Harness/Recolor/, Assets/_Harness/Recolor.meta, Assets/_Harness/Menu/, Assets/_Harness/Menu.meta, _harness_build/regression_pre/]
    resources: [unity_batch]
    # prepareCommand refreshes this stage's own copy and drops its old Assets/_BuildArtifacts, so the copy is rebuilt
    # before it is measured; build_pre's slot is never touched, so its artifact version does not move (PF1 D5).
    # HarnessFitStage runs Play asynchronously and exits Unity itself; -quit would end the editor before Play starts.
    unitySteps:
      - {method: AVH.Harness.BuildStage.Run, project: _harness_build/regression_pre/project, timeoutSec: 5400, env: {AVH_BUILD_SLOT: pre}}
      - {method: AVH.Harness.RegressionStage.Run, project: _harness_build/regression_pre/project, timeoutSec: 5400, env: {AVH_BUILD_SLOT: pre}}
      - {method: AVH.Harness.HarnessFitStage.Run, project: _harness_build/regression_pre/project, quit: false, timeoutSec: 2400, env: {AVH_BUILD_SLOT: pre}}
