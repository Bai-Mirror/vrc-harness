    goal: 修复最终回归发现的实际功能、几何或优化回归；只修改源工程派生层。Provider 退出后 Harness 会强制刷新隔离构建副本，再由 Runtime 独立重建并测量。不得通过隐藏无关身体、破坏造型或删除功能来换取检测通过。
    maxRetries: 2
    maxCheckRetries: 3
    prepareCommand: [python3, "{toolRoot}/harness/build_copy.py", --slot, regression]
    allowedWrites: [Assets/_Harness/Outfit/, Assets/_Harness/Outfit.meta, Assets/_Harness/Recolor/, Assets/_Harness/Recolor.meta, Assets/_Harness/Menu/, Assets/_Harness/Menu.meta, Assets/_Harness/Optimize/, Assets/_Harness/Optimize.meta, _harness_build/regression/]
    resources: [unity_batch]
    # prepareCommand refreshes this stage's own copy and drops its old Assets/_BuildArtifacts, so the copy is rebuilt
    # before it is measured; build's slot is never touched, so its artifact version does not move (PF1 D5).
    # HarnessFitStage runs Play asynchronously and exits Unity itself; -quit would end the editor before Play starts.
    unitySteps:
      - {method: AVH.Harness.BuildStage.Run, project: _harness_build/regression/project, timeoutSec: 5400, env: {AVH_BUILD_SLOT: final}}
      - {method: AVH.Harness.RegressionStage.Run, project: _harness_build/regression/project, timeoutSec: 5400, env: {AVH_BUILD_SLOT: final}}
      - {method: AVH.Harness.HarnessFitStage.Run, project: _harness_build/regression/project, quit: false, timeoutSec: 2400, env: {AVH_BUILD_SLOT: final}}
  performance:
    mode: tool
    # PerformanceStage reads the built avatar in the final slot and writes only perf-final.json under the Run
    # directory (always writable), so it needs no project write and is granted none: the build artifact has no other
    # writer than the build stage.
    allowedWrites: []
    resources: [unity_batch]
    unitySteps: [{method: AVH.Harness.PerformanceStage.Run, project: _harness_build/final/project, timeoutSec: 3600, env: {AVH_BUILD_SLOT: final}}]
