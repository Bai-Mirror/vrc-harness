  face_design:
    mode: provider
    role: executor
    context:
      - {id: common.execution-model.face, path: context/common/Harness执行模型.md, heading: Harness 正式流程里执行方能做什么, priority: 1000, required: true, covers: [common.execution-model]}
    goal: |
      依据原始参考图、用户要求及已批准脸型方向给出2–5个原形态键组合候选，不直接编辑网格，不让用户选择技术键、配方或填写对象路径。
      先用inspect-face读取真实Unity源观察，再用catalog-face观察精确目标的Blender键、源范围与实际运行时写入者。来源只用已批准导入工程内的实际FBX，不按名称猜键角色。
      Blender原生打开受管副本中的原FBX，保留全部网格、骨架和形态键槽。工具不再从Unity数据重建Blender源或模拟Unity导入器。选择后计算表情补偿并导出，在受管工程同路径、同.meta及同导入器下比较新旧真实导入；bindpose按绑定姿势及测试姿势的实际蒙皮偏差判定。检查失败须保留具体证据，不用改导入设置或缩小用户目标绕过。
      眼面识别合同为sdk-eye-motion-weighted-island/2：SDK绑定、源骨三轴实测运动、相对混合权重和材质内连通岛共同选面，不要求眼骨权重大于0.5；冻结面/UV/运动身份，并由独立源回读重建核验。Unity原生路径按位置/UV回绑，保留导入器影响重映射的事实。实际Blender桥接单操作默认3600秒，可按AVH_BLENDER_TIMEOUT_SEC在1–86400秒间配置，完整回读不受旧900秒局部上限阻断；仍服从Runtime总预算/取消，不减少验证状态。原生导出保留非目标和目标保留键的FBX默认通道，只有目标烘焙键归零；独立回读与Unity同路径共同核查。补偿合同为regional-additive/1：左右眼、逐表情按源眼球露出率求闭合系数，做“旧delta−系数×区域遮罩×设计位移”。口型默认保留delta并检查，不采用IDW非线性目标。设计键保留原delta、烘焙后归零。正权重的残余滑杆下限为−已烘焙权重，上限始终为观察到的原上限−已烘焙权重；显式源范围扩展单独校验，不能抬高此残余上限。超过原上限的烘焙权重无法同时满足归零与残余上限，工具会明确拒绝。负权重撤回方向向上，残余下限保留0以容纳归零。
      顶点偏差使用冻结的0.1 mm级判据；近退化边看绝对长度，其余自交/塌陷/褶皱/破损仍检查。原始质量标记保留为证据，Runtime按状态、区域、类型去重汇总，标明原版情况、毫米/特写像素估计及同状态原版/新版特写；几何范围不代表肉眼可见面积，不以标记条数停止制作。眼部记录半状态、0.6–0.9及完整状态露出率并渲染特写，原版对照先证明采样有效。数值与渲图都不能代替用户接受。Prefab引用完整候选FBX，不生成FaceMesh.asset；接受后的同路径保留.meta交付事务尚未执行时须明确报告。
      只提交 _harness/face/request.json，精确字段 {schema: face-request/0.2, observationSha256: 原观察文件SHA256, targetId: 真实目标ID, candidates: [{id: 稳定候选ID, values: {Unity原键名: Blender-relative数值}, rangeOverrides?: {Unity原键名: {originalMin, originalMax, newMin, newMax}}}]}。键方向正确而幅度不足时可显式扩大源范围；原上下限必须来自观察，新范围必须包含原范围。不提交顶点、补偿数组或编造新的键。
      候选仅为设计提议。不得提交selectedCandidateId、选择、批准、role、recipe或pass；Harness会验证组合和基础形状质量，渲染真实组合图给用户选择；选定后才计算完整表情补偿并检查各表情质量。图片不等于最终FBX、表情或外观已经验收。没有合适可用形态键时报告实际不足，由Harness继续寻找可行材料或工具路径。
    maxRetries: 1
    maxCheckRetries: 0
    prepareCommand: [python3, "{toolRoot}/harness/face.py", candidates, --project, "{project}", --sources, "{toolRoot}/harness/unity/Editor/FaceStage.cs", "{toolRoot}/harness/unity/Editor/FaceGeometry.cs", "{toolRoot}/harness/unity/Editor/FaceEyes.cs", "{toolRoot}/harness/unity/Editor/FaceMapping.cs", "{toolRoot}/harness/unity/Editor/FacePreviewStage.cs", "{toolRoot}/harness/unity/Editor/AvhCommon.cs", "{toolRoot}/harness/unity/Editor/LocalOperations.cs", "{toolRoot}/harness/unity/Editor/OutfitStage.cs", "{toolRoot}/harness/unity/Editor/SetupStage.cs", "{toolRoot}/harness/blender_face.py", "{toolRoot}/harness/blender_face_observe.py", "{toolRoot}/harness/blender_face_common.py", "{toolRoot}/harness/blender_face_transfer.py", "{toolRoot}/harness/blender_face_mapping.py"]
    agentTools:
      inspect-face: [python3, "{toolRoot}/harness/face.py", inspect, --project, "{project}"]
      catalog-face: [python3, "{toolRoot}/harness/face.py", catalog, --project, "{project}", --sources, "{toolRoot}/harness/unity/Editor/FaceStage.cs", "{toolRoot}/harness/unity/Editor/FaceGeometry.cs", "{toolRoot}/harness/unity/Editor/FaceEyes.cs", "{toolRoot}/harness/unity/Editor/FaceMapping.cs", "{toolRoot}/harness/unity/Editor/FacePreviewStage.cs", "{toolRoot}/harness/unity/Editor/AvhCommon.cs", "{toolRoot}/harness/unity/Editor/LocalOperations.cs", "{toolRoot}/harness/unity/Editor/OutfitStage.cs", "{toolRoot}/harness/unity/Editor/SetupStage.cs", "{toolRoot}/harness/blender_face.py", "{toolRoot}/harness/blender_face_observe.py", "{toolRoot}/harness/blender_face_common.py", "{toolRoot}/harness/blender_face_transfer.py", "{toolRoot}/harness/blender_face_mapping.py"]
    allowedWrites: [Assets/_Harness/Face/Catalogs/, Assets/_Harness/Face/Catalogs.meta, Assets/_Harness/Face.meta, Assets/_Harness.meta, _harness/face/request.json, _harness/face/blender-private/]
    runtimeWrites: [Assets/_Harness/Face/CandidateSets/, Assets/_Harness/Face/CandidateSets.meta, Assets/_Harness/Face/preview-input.json, Assets/_Harness/Face/preview-input.json.meta, _harness/face/candidates.json, _harness/face/candidate-preview/, _harness/face/candidate-preview/manifest.json]
    runtimeTemporaryWrites: [Assets/_Harness/Face/preview-input.json.writing, _harness/face/candidates.json.writing]
    resources: [unity_batch]
    unitySteps: [{method: AVH.Harness.FacePreviewStage.RenderCandidates, timeoutSec: 1800}]
  face:
