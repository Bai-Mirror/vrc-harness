    goal: |
      依据用户审美目标设计并生成可比较的配色候选；必须调用 generate-recolor-candidates 后检查并完善产物。
      分层源在清点登记的压缩包里，用清点给出的 container 与 path 寻址；不要对用户目录做无界递归查找（例如 -Recurse 整个用户目录），找不到就用 inspect-layer-source / resolve-layer-source 报出的路径。
      遇到适配件缺配套材质时，调用 inspect-material-dependencies，只观察已确认输入同商品目录的公共包。
      可将观察出的 anchor/archive/sha256 原样写入 Assets/_Harness/Recolor/dependencies.json（schema material-dependencies/0.1，packages 数组）。
      Runtime 只在当前用户授权目录内按 SHA 校验、补入未接受派生层，不覆盖原素材、已接受脸型或前序产物；不能自行解包或伪造授权/回执。
      shader 缺失时，可在同请求中提出 missing_shader_replacement（已安装的准确 shader 名），只修派生材质副本；不得替换有效 shader。
      eye 支持名字为 eye/瞳的独立材质，也支持启用且纹理明确含 eye/瞳的 lilToon 第二叠色层；后者仅调整 _Color2nd，不改变脸主色或主贴图 HSVG。
      若眼部遮罩存在但开关关闭，在 dependencies.json 的 iris_layers 提交 material_guid/texture_guid/source_sha256/expected_enabled/enable:true；Runtime 复核授权 eye 目标、实际素体材质与遮罩、源SHA和开关，仅在新副本启用。
      需求要在一张贴图、一个材质上把两处表面改成不同颜色（左右异色瞳）时，用方案里的按区域目标：区域由 Unity 步骤从网格 UV 足迹导出（渲染器 + 子网格 + 骨名），不是贴图上的矩形，也不是 u=0.5 的切分。掩膜与产物按**原文件的尺寸**生成（导入上限 maxTextureSize 只是运行期预算，不是区域尺寸），产物随后继承原件的导入设置。区域外一个像素都不许动；两个区域共有的像素、以及属于两个区域的三角形盖住的像素，两边都不上色；某个区域没有排他像素时整条阻断，不许两边都刷。全透明像素保持原 RGB，区域里一个可见像素都没有也阻断。同一张源贴图只允许一组区域写，绑定的槽位只能是它声明的渲染器与子网格；`MeasureMaterialTargets → MaterialTargetReadback` 独立重载最终变体，枚举实际 Renderer／槽／材质／贴图集合，并以方案哈希与递归依赖文件哈希绑定证据，模型预制体（包括 FBX）与实例身份由 Unity 实际回读解决；没有独立回读时的 YAML 解析只能作诊断说明，不能放行。同槽号同材质、另一渲染器的覆盖项、Transform 目标或声明之外的额外表面都必须拒绝。回读按各区域自己的掩膜取样，不要用整张合成图的 alpha；台账每条需求各自一行。两种语义各按自己的算法核对：flat 是目标色，shade 是**目标色的每个通道**乘以「本像素最亮通道 ÷ 目标色最亮通道」，不是乘原像素。
      不要把 eye 需求删除来通过检查。来源不在授权范围、候选无法判定或需要改变用户造型目标时，报告清楚的中文选项，保留证据。
    maxRetries: 2
    maxCheckRetries: 2
    agentTools:
      generate-recolor-candidates: [python3, "{toolRoot}/harness/recolor.py"]
      inspect-material-dependencies: [python3, "{toolRoot}/harness/material_dependencies.py", inspect]
      inspect-layer-source: [python3, "{toolRoot}/harness/layer_source.py"]
      check-layer-source-deps: [python3, "{toolRoot}/harness/layer_source.py", doctor]
      resolve-layer-source: [python3, "{toolRoot}/harness/layer_source.py", resolve]
      apply-layer-recipe: [python3, "{toolRoot}/harness/layer_source.py", apply]
    prepareCommand: [python3, "{toolRoot}/harness/material_dependencies.py", prepare, "{toolRoot}/harness/unity/Editor/LocalOperations.cs", "{toolRoot}/harness/unity/Editor/OutfitStage.cs", "{toolRoot}/harness/unity/Editor/OutfitVisibility.cs", "{toolRoot}/harness/unity/Editor/SetupStage.cs", "{toolRoot}/harness/unity/Editor/AvhCommon.cs", "{toolRoot}/harness/unity/Editor/FaceStage.cs", "{toolRoot}/harness/unity/Editor/FaceGeometry.cs", "{toolRoot}/harness/unity/Editor/FaceEyes.cs", "{toolRoot}/harness/unity/Editor/FaceMapping.cs", "{toolRoot}/harness/unity/Editor/RecolorStage.cs", "{toolRoot}/harness/unity/Editor/MenuStage.cs", "{toolRoot}/harness/unity/Editor/AvatarAudit.cs", "{toolRoot}/harness/unity/Editor/RegressionStage.cs"]
    runtimeWrites: [Assets/_HarnessTools/Editor/LocalOperations.cs, Assets/_HarnessTools/Editor/OutfitStage.cs, Assets/_HarnessTools/Editor/OutfitVisibility.cs, Assets/_HarnessTools/Editor/SetupStage.cs, Assets/_HarnessTools/Editor/AvhCommon.cs, Assets/_HarnessTools/Editor/FaceStage.cs, Assets/_HarnessTools/Editor/FaceGeometry.cs, Assets/_HarnessTools/Editor/FaceEyes.cs, Assets/_HarnessTools/Editor/FaceMapping.cs, Assets/_HarnessTools/Editor/RecolorStage.cs, Assets/_HarnessTools/Editor/MenuStage.cs, Assets/_HarnessTools/Editor/AvatarAudit.cs, Assets/_HarnessTools/Editor/RegressionStage.cs]
    allowedWrites: [Assets/_Harness/Recolor/, Assets/_Harness/Recolor.meta]
    resources: [unity_batch]
    unitySteps: [{method: AVH.Harness.RecolorStage.Run, timeoutSec: 3600}, {method: AVH.Harness.RecolorStage.MeasureMaterialTargets, timeoutSec: 1800}]
