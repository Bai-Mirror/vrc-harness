    goal: |
      读取 _harness_build/pre/project/Assets/_BuildArtifacts/Avatar/perf.json 与
      _harness_build/regression_pre/project/_regression/coverage.json（优化前回归证据），逐项制定可逆优化，
      只写 Assets/_Harness/Optimize/design.json（schema optimize-design/0.1），随后 Harness 冻结工具会实现它。
      已批准方案 optimization.mode 为 preserve 时，不执行下面的优化设计，不添加或改动优化器、贴图、骨骼。
      该分支由 Runtime 保存原样产物及交付场景，并验证保留关系；检查仍适用，发现超限应报告并提出新方案，不能擅自优化。
      design.json 的 textures 必须恰好覆盖 perf.json 中当前交付头像使用的每个 GUID，每项结构：
        {"guid":"...","action":"keep|downscale","target_max_size":2048,"rationale":"基于角色/屏幕占比/格式的理由",
         "visual_review":{"status":"approved|pending|not_required","evidence":"审美确认或不需要的依据"}}
      main 主视觉只要降低尺寸就必须已有 visual_review.status=approved，且不低于 2048；没有审美确认时选 keep（超过 2048 也可以保留），不得代替用户判断不可见差异。
      辅助图超过 1024、Cubemap 超过 512 的必须降到档位（它们没有审美闸门；A/B 看得出差异时在 rationale 写明风险）。
      perf.json 覆盖的是构建后交付头像的贴图，优化步骤校验的是菜单层预制体；只出现在构建期、菜单层不使用的 GUID 会被登记为
      「未套用」（构建副本保留厂商原始导入设置），不算设计错误，也不用为了避开它而少写一项。
      根据 perf.json.physbones 的 redundant_with 生成 physbone_actions；只允许：
        {"action":"remove_duplicate","object":"头像根相对路径","remove_index":1,"keep_index":0,"rationale":"逐字段等价且碰撞体为保留项子集"}
      所有可证明冗余项必须处理；禁止自行合并不同骨链。读取 aabb_contributors 解释超界来源，但不得通过缩头像或盲改 bounds 掩盖。
      同时写 aao.rationale，说明为什么保留安全配置。不得改菜单、服装源资产或厂商贴图 meta。
    maxRetries: 2
    maxCheckRetries: 2
    allowedWrites: [Assets/_Harness/Optimize/design.json, Assets/_Harness/Optimize/, Assets/_Harness/Optimize.meta]
    runtimeWrites: [ProjectSettings/SceneTemplateSettings.json]
    resources: [unity_batch]
    unitySteps: [{method: AVH.Harness.OptimizeStage.Run, timeoutSec: 3600}]
  build:
