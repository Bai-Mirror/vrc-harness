    goal: |
      依据用户已批准的目标、方案和本次对象观察完成装配；不让用户填写对象路径或技术字段。
      Runtime 在 setup 后已观察 _harness/setup/object-observation.json；inspect-local-objects 可分页读取对象/renderer_index/材质槽/shader属性及引用来源摘要。
      需要精确局部改材质、贴图、挂配件或调整子对象变换时，只写 Assets/_Harness/Outfit/local-operations.json；Runtime 在你退出后执行并重载独立检查。
      输入为 {schema: local-operations/0.1, observation_sha256: 原始观察文件SHA256, operations: [操作]}，最多128项，id是唯一小写英文短名。
      path填写原始观察的逻辑成员路径；等价菜单成员可共享实例，Runtime按成员id→物理object映射解析根与子路径，重复写入按物理目标拒绝。回执logical_objects仅展示映射；独立重载验证从源重新装配并重建映射。材质操作更新点名成员有效预设并持久绑定，贯通配色与菜单，其他变体保留。共享写者复核按同一物理对象实证校验供等价成员消费，一致别名可合并，矛盾拒绝。
      setup先观察源结构，phase为source_preview，不先装配。待骨骼比对实例保留菜单归属与use/outfit义务，批准仅授权试装。实例prefab可选catalog的prefabs/models中实际Unity GameObject源；inspect-local-objects --section sources读取层级、组件、蒙皮骨槽。模型安装不证明厂商安装器的特定行为已实现。
      assembly: {id, kind: assembly, path: _Outfit/Outfit_<已批准成员id>, mode: mount, mounts: [{source: 观察里的实例内相对路径（根为""）, path: 观察里的素体对象路径, pose: preserve或relative, position/rotation: relative时必填三项数组}]}。源不可重叠；或提交 {id,kind: assembly,path,mode: merge}，仅用于实际蒙皮源。Runtime绑定观察版本后先生成装配组件，再装配、重载核对实际映射/挂点/姿态；不得覆盖厂商MA装配组件或换来源。实测失败保留证据并技术返工，不能自动defer或豁免；other安装件证明自己的实例，texture依赖明确承载。package仍要求使用引用，或已批准且一致的unused/exclude处置。
      material: {id, kind: material, path: 观察里的对象路径, renderer_index: 观察值, slot: 观察槽位, source_material: 任一实际观察材质槽中已有的授权材质完整路径（复制使用，可填空槽或替换丢失shader）, properties: {shader属性名: {type: float/color/vector/texture, value: 数值/四项数组/已观察授权贴图路径}}}。
      transform: {id, kind: transform, path: 观察里的非根对象路径, position: [x,y,z], rotation: [x,y,z], scale: [x,y,z]}，省略不改的项；rotation为局部欧拉角度，scale必须全正。
      attach: {id, kind: attach, path: 观察里的父对象路径（空字符串为头像根）, prefab: references里已批准导入的预制体路径, position/rotation/scale: 可选三项数组}。生成子件名为_Local_<id>，不覆盖已有对象。
      object_state: {id, kind: object_state, path: 观察里的非根对象路径, active: 可选布尔值, exclude_from_build: 可选且只能为true}。显隐只影响该对象；构建排除标EditorOnly，不能用它宣称修复骨引用或撤回上游排除。必需素体网格、骨骼或已接受脸型不能排除；关闭衣物前先核对覆盖与用户目标。
      装配后的默认显隐由你依证据决定：第一轮装配后 Runtime 会写出默认状态下实际可见的部件清单与重叠量距，用 inspect-local-objects --section visibility 读它——摘要先给重叠堆、每堆成员与来源、最大互接触面积、**按身体部位分组的可见件（每个部位列出各来源的件）**、素体自带衣物分组及证据、已按决定关闭的部件，对表分页。两条阻断检查会把同位叠放与**衣物之间看得见的互穿**拦下：前者是 `outfit_visible_overlaps`（读 visible_overlap_pairs），后者是 `outfit_visible_interpenetration`（读 visible_interpenetration_pairs，读数在摘要的 visible_interpenetration 里，逐对给里层、外层、候选顶点数、确认顶点数与确认视角；null 表示没量完，不是 0；一节顶部还给出 `counted_pairs`（仍在阻断的对数）、`undecided_pairs`、`out_of_bounds_accepted_pairs`、`ask_user_pairs`，逐对有 `decision`／`decision_valid`／`decision_note`）。因此重试时先读这份清单，再用 object_state（active: false；厂商测试或辅助网格另加 exclude_from_build: true）把不该默认显示的件关掉，每条必须写 rationale（依据哪份读数、为什么保留另一件），不写或空理由的关闭会被拒绝。**同一部位出现同类的两件时**（同一部位下的两副耳饰、两双鞋、两层袜），按订单与方案决定保留哪件并把理由写进 rationale；取舍会改变用户要的效果时写进 user_review。**衣物之间的互穿：Runtime 摆证据，你逐对三选一。** 读数（摘要的 `visible_interpenetration`）对每个达到最小量的确认对给出证据：`confirmed`（渲图确认顶点数）、`visible_pixels`（渲图里看得见的像素量）、`depth_max_mm`／`depth_median_mm`／`depth_counts`（确认样本到外层最近三角面的带符号距离，量程 `poke_reach_mm` 以内是实测；`depth_at_least=true` 表示最深样本只到量程上界，要读作「至少 depth_max_mm」而不是实测值）、`body_part`／`outer_part`（各自部位）、`layer_source`／`outer_source` 与 `layer_role`／`outer_role`（来源与它在订单里的角色，如 `hair`／`outfit`）。**判据不替你决定**：每一对都要在配方的 `interpenetration_decisions` 里写下三选一——`close`（可恢复关闭，配方里必须真有这条 `object_state`，并写 `rationale`）、`accept`（按准则接受，写 `criterion` 依据哪条准则与 `evidence` 看了哪项证据，不打扰用户）、`ask_user`（保留并请用户确认，写 `rationale` 与 `review`——指向 `user_review` 里那条编号取舍，方案只写在那一处，进交付说明的「需要你确认的取舍」）。**护栏**：`out_of_bounds=true` 的对（确认顶点数 > 128、实测深度 > 2 mm，或 `depth_at_least=true` 即深度没量到护栏以内）不许用 `accept` 放过，只能 `close` 或 `ask_user`；没有有效决定的对、以及越界却被 accept 的对，都计入 `visible_interpenetration_pairs`。**准则**（不是清单，边缘情况由你判断）：按正常观看距离看不看得出来；订单点名的件优先保留；同一部位重复的只留一件；改变订单方要的外观时才问用户；关掉贴身里层之前先看它外面那层下面是不是直接就是身体，是就优先 accept 或 ask_user——关掉可能让回归阶段看到身体从外层穿出；**订单把一个整套列为配饰、另一个列为服装时，两者在同一部位冲突就让配饰套装里的服装件让位**：关掉配饰套装里与主服装冲突的裙、鞋之类并写明理由，配饰套装里的纯配饰件（头饰、链饰、刀具之类）照常保留；一件是服装还是配饰从方案条目与建档的 `role` 读，不按名字猜，判断不了的按编号取舍交用户。**示例**：全身丝袜与鞋子、外套只隔薄薄一层的相交没关系；袜子与全身丝袜位置重叠时关掉袜子；头发与外套的相交默认不管；订单把一整套列为服装、另一整套列为配饰时，配饰套装里的裙子与高跟鞋跟主服装的外套、靴子冲突，就关掉配饰套装里的那两件，配饰套装里的头饰照常保留。可恢复的默认显隐你可以自己定；取舍会改变用户要的外观时不要自己拍板，写进本轮提交的 `user_review` 编号取舍交用户确认——每项 `{id: T1/T2…, question, detail, options: [{id: A/B…, label, operations: [可恢复的 object_state]}], recommended: 一个方案编号, current: 本轮实际用的方案编号}`，2–4 个方案，方案里只能用可恢复操作（不能写构建排除，「保持现状」写空数组），`recommended` 恰好一个，`current` 必须与配方里实际生效的操作一致。方案数、编号唯一、引用的对象在观察里存在、推荐唯一、`current` 与配方一致，Runtime 都校验，不合格整份配方被拒。交付说明按编号列出各方案并标出「推荐」与「当前」，用户回「Tn 选 X」即可；重做意见里写了编号时，照上次回执里该编号方案 X 的 `operations` 执行并把 `current` 改成 X，其余取舍保持不变。不要靠关掉订单点名要的那一层让判据变绿，也不要用放宽阈值的方式绕过。完整口径见注入的「装配后的默认显隐」知识小节。
      foot_writer: {id, kind: foot_writer, path: 观察里的非根对象路径, component_index: components数组中MA Shape Changer的序号, remove_shapes: [真实脚部键名], rationale: 明确的取舍说明}。仅移除该组件点名的foot/toe/ankle/heel或足脚踝爪键写者，保留默认网格与其他键；不能写批准字段。先从观察/YAML核对效果目标与写者关系，决定保留厂商机制还是移除风险脚型写者，勿默认清空。Runtime按实际产物重新清点风险；移除不代表三态实测，鞋袜贴合与外观仍由后续真实回归核验并披露。
      shrinkkey_review: {id, kind: shrinkkey_review, path: _Outfit/Outfit_<已批准id>, writers: [按实际先序逐项的宿主->目标:键=Set/Delete字符串], rationale: 键类别/宿主/覆盖关系及多写者先后和最终胜者, scenarios: {shoe_on_sock_on: 预期, shoe_off_sock_on: 预期, barefoot: 预期}}。这是授权范围内的局部方案复核/返工通路：inspect-local-objects --section reviews 读取 Runtime 写者清点（旧版本取上一轮装配记录作线索）；核对厂商YAML，保留旧操作并补此项，不能修改 plan.yaml 或填 status/approved/实测标志。Runtime 按观察SHA、源资产、完整实际写者顺序与冲突值校验后登记 runtime_verified；原方案、接受脸型、旧Run不变，三态外观仍待回归。不要因原方案漏项原样重试或让用户修文件。
      超出已批准服装/目标、需要取舍冲突值或改变效果目标时不要自动批准；写进 `user_review` 的编号取舍：每条给 2–4 个可执行方案（可恢复的 `object_state`，「保持现状」是空操作）、标出一个 `recommended`、标出本轮实际用的 `current`，用简体中文说明每个方案会让交付物变成什么样，通过已有确认/反馈入口等待用户决定。用户回「Tn 选 X」时按该方案执行。保留技术证据，不虚构选择或三态实测。
      素材只能来自本次Manifest已导入且实际观察到的引用；不按hair/eye名字猜槽位。相同槽位或对象变换不能重复写。无局部需要可不写该文件，旧装配配方继续有效。
      材质始终复制，原件和上游资产不可写。不要手改Avatar.prefab、生成材质或写验证pass；独立失败会携带读数返回，修正操作输入。
      Unity 装配自行检查素体、衣装和嵌套实例的真实缺失材质引用，只移除子网格之外可安全删除的尾部叠加槽并写入回执。自身子网格槽或被有效槽隔开的缺件会停止并请求决定，不自动选择替代材质；不要伪造 setup 清单或修改厂商预制体。独立 Observe 从持久化产物检查有效依赖，零阻断断链是正式判据。Unity 序列化里「对象为空、实例 ID 为 0、且来源文本定位不到该属性」的字段是默认空值（Unity 省略默认字段，FBX 导入的对象没有文本可读），不是断链：它们单独计数为 `unlocated_null_refs`，并按「对象类型＋属性路径（下标归一）」分组写进观察 notes，不阻断；定位到的指针解析不到对象、或实例 ID 非 0 而对象为空，仍然阻断。实际导入的登记原件本身即引用该 GUID、且全部已拥有来源均无提供者的厂商材质 m_SavedProperties.m_TexEnvs 下的贴图缺件只记提醒并写交付说明（判据是引用的来源，不是文件字节没被改过：厂商着色器包会在导入期迁移材质、改字节而不改引用；按 GUID 比，不按下标）；m_Shader 和其他对象引用缺失仍阻断；Assets/_Harness/ 下生成的材质、以及登记原件未引用该 GUID（导入后才出现）的缺件仍阻断。
      本接口没有网格捏脸、Blendshape烘焙、闭眼补偿或Blender能力，不能宣称完成这些要求；超出已接通动作应明确报告仍需系统能力。
    maxRetries: 2
    # Raised from 2 (three attempts) to 4 (five) because the D-138/D-145 assembly loop on A needs three:
    # the first pass reads no_data while too many stacking and interpenetration candidates remain, closing
    # the stacking leaves the interpenetrations to decide, and only the third passes. The old value allowed
    # exactly those three and left no margin; GI1 measured one missed pair on a run that reached its end.
    maxCheckRetries: 4
    prepareCommand: [python3, "{toolRoot}/harness/local_operations.py", contract, "{toolRoot}/harness/unity/Editor/LocalOperations.cs", "{toolRoot}/harness/unity/Editor/OutfitStage.cs", "{toolRoot}/harness/unity/Editor/OutfitVisibility.cs", "{toolRoot}/harness/unity/Editor/SetupStage.cs", "{toolRoot}/harness/unity/Editor/AvhCommon.cs", "{toolRoot}/harness/unity/Editor/FaceStage.cs", "{toolRoot}/harness/unity/Editor/FaceGeometry.cs", "{toolRoot}/harness/unity/Editor/FaceEyes.cs", "{toolRoot}/harness/unity/Editor/FaceMapping.cs", --project, "{project}", --install]
    agentTools:
      inspect-local-objects: [python3, "{toolRoot}/harness/local_operations.py", inspect, --project, "{project}"]
    allowedWrites: [Assets/_Harness/Outfit/, Assets/_Harness/Outfit.meta, Assets/_Harness.meta]
    runtimeWrites: [Assets/_HarnessTools/Editor/LocalOperations.cs, Assets/_HarnessTools/Editor/OutfitStage.cs, Assets/_HarnessTools/Editor/OutfitVisibility.cs, Assets/_HarnessTools/Editor/SetupStage.cs, Assets/_HarnessTools/Editor/AvhCommon.cs, Assets/_HarnessTools/Editor/FaceStage.cs, Assets/_HarnessTools/Editor/FaceGeometry.cs, Assets/_HarnessTools/Editor/FaceEyes.cs, Assets/_HarnessTools/Editor/FaceMapping.cs]
    resources: [unity_batch]
    unitySteps:
      - {method: AVH.Harness.OutfitStage.Run, timeoutSec: 3600}
      - {method: AVH.Harness.OutfitStage.Observe, timeoutSec: 600}
