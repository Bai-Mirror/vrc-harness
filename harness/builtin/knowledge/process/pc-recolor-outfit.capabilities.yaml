      - {id: k8a.case.package.pre-redelivery-cleanup.fallback, path: cases/package/delivery-hygiene.md, heading: 重交前清理：审查残留、开发依赖与 ProjectSettings 都要回到交付基线, priority: 5, covers: *a216}
      - {id: k8a.case.package.redelivery-no-overwrite.fallback, path: cases/package/delivery-hygiene.md, heading: 已交付的包要重打：覆盖前单独确认，旧包改名留底, priority: 5, covers: *a217}
      - {id: k8a.case.package.resident-probe-scripts.fallback, path: cases/setup/unity-side-effects.md, heading: 常驻的旧诊断脚本每次进 Play 都在改参数：先清掉再测, priority: 5, covers: *a218}
      - {id: k8a.case.package.sdk-panel-import-errors.fallback, path: cases/package/delivery-hygiene.md, heading: SDK 面板的导入设置类错误：用 SDK 自带的修复，并确认不是本次引入, priority: 5, covers: *a219}
      - {id: k7.package.case.archive.failed-mobile-conversion.fallback, path: cases/setup/存档与依赖.md, heading: 案例：旧「副本」里 7 个材质比新包还新，看着像丢了活：其实是一次失败的移动端转换, priority: 4, unless: [{path: memory.history.failedStageIds, includes: package}], covers: [case.archive-triage]}
      - {id: k7.package.case.archive.projectcache-field-order.fallback, path: cases/setup/存档与依赖.md, heading: 案例：从 ProjectCache 读版本，把 AAO 1.9.8 读成了 3.2.1, priority: 4, unless: [{path: memory.history.failedStageIds, includes: package}], covers: [case.dependency-projectcache]}
      - {id: k7.package.case.criteria.exemption-swallows-true-positive.fallback, path: cases/regression/判据失效.md, heading: 案例：为消误报加的豁免，把一个已知的真缺陷也吞掉了, priority: 4, unless: [{path: memory.history.failedStageIds, includes: package}], covers: [case.criteria-exemption]}
      - {id: k7.package.case.criteria.script-residue-clean.fallback, path: cases/regression/判据失效.md, heading: 案例：按类名搜脚本、删除后再按 guid 查残留，两种检查都报「干净」, priority: 4, unless: [{path: memory.history.failedStageIds, includes: package}], covers: [case.criteria-script-residue]}
      - {id: k7.package.case.scene.discard-reload-human-pose.fallback, path: cases/common/场景损坏.md, heading: 案例：自检看到「手臂不在 A-pose」就丢弃重载，冲掉了人正在摆的姿势, priority: 3, unless: [{path: memory.history.failedStageIds, includes: package}], covers: [case.discard-human-work]}
    goal: |
      读取以下权威证据后，只写 _harness/delivery/diagnosis.json：
      - _harness_build/final/project/Assets/_BuildArtifacts/Avatar/build_manifest.json 与 perf.json
      - _harness_build/regression/project/_regression/coverage.json
      - Assets/_Harness/Menu/menu.json、Assets/_Harness/Optimize/optimize.json、_harness/intake/inventory.json、_harness/setup/import.json
      schema 为 delivery-diagnosis/0.1，字段为 verdict（ready|blocked）、blockers、verified、client_checks、material_summary、performance_tradeoffs。
      verified 每项必须有 id、summary、非空 evidence 路径/观察引用；没有证据不得写成已验证。
      client_checks 必须恰好包含 upload、network_sync、saved_reload、vr_gestures、platform_rendering，全部 status=pending，且各有 steps、expected、evidence_limit。
      任何编译、菜单、几何、性能、缺失引用阻断都写入 blockers 并令 verdict=blocked；不得修改前序资产。
      Provider 退出后 Harness 才验证 JSON、生成面向用户的 Markdown、打包并冷导入；结构不一致或仍有 blocker 时不会出包。
    maxRetries: 1
    maxCheckRetries: 1
    prepareCommand: [python3, "{toolRoot}/harness/package.py", --library, "{assetLibrary}"]
    allowedWrites: [_harness/delivery/diagnosis.json, _harness/delivery/, _harness_build/delivery/, _harness_build/cold/]
    resources: [unity_batch]
    unitySteps: [{method: AVH.Harness.ColdImportStage.Run, project: _harness_build/cold/project, timeoutSec: 5400}]

observers:
  plan.inputs: {command: [python3, "{toolRoot}/harness/plan.py", observe-inputs, --project, "{project}", --out, "{out}"], timeoutSec: 120}
  plan.source: {command: [python3, "{toolRoot}/harness/plan.py", observe, --config-tool, "{toolRoot}/harness/avatar_config.py", --project, "{project}", --out, "{out}"], timeoutSec: 120}
  face.candidates: {runFile: observations/face.candidates.json}
  face.apply: {runFile: observations/face.apply.json}
  face.input: {command: [python3, "{toolRoot}/harness/face.py", input-check, --out, "{out}"]}
  environment.verify:
    command: [python3, "{toolRoot}/harness/environment.py", verify, --project, "{project}", --recipe, "{toolRoot}/harness/environment-recipe.json", --out, "{out}"]
    timeoutSec: 600
  assets.inventory: {command: [python3, "{toolRoot}/harness/observe_assets.py", --library, "{assetLibrary}", --out, "{out}"], timeoutSec: 900}
  assets.validate: {command: [python3, "{toolRoot}/harness/observe_assets.py", --library, "{assetLibrary}", --out, "{out}"], timeoutSec: 900}
  project.initialize: {command: [python3, "{toolRoot}/harness/observe_project.py", --environment-tool, "{toolRoot}/harness/environment.py", --environment-recipe, "{toolRoot}/harness/environment-recipe.json", --out, "{out}"], timeoutSec: 300}
  assets.import: {command: [python3, "{toolRoot}/harness/observe_project.py", --environment-tool, "{toolRoot}/harness/environment.py", --environment-recipe, "{toolRoot}/harness/environment-recipe.json", --out, "{out}"], timeoutSec: 300}
  clothing.install: {runFile: observations/clothing.install.json}
  material.recolor: {command: [python3, "{toolRoot}/harness/observe_recolor.py", --out, "{out}"], timeoutSec: 600}
  avatar.observe: {runFile: observations/avatar.observe.json}
  avatar.dependencies: {runFile: observations/avatar.dependencies.json}
  menu.configure: {runFile: observations/menu.configure.json}
  menu.dump: {runFile: observations/menu.dump.json}
  avatar.verify: {runFile: observations/avatar.verify.json}
  avatar.fit: {runFile: observations/avatar.fit.json}
  avatar.build: {runFile: observations/avatar.build.json}
  performance.check: {runFile: observations/performance.check.json}
  delivery.package: {command: [python3, "{toolRoot}/harness/observe_package.py", --out, "{out}"], timeoutSec: 900}
  delivery.cold_import: {runFile: observations/delivery.cold_import.json}
