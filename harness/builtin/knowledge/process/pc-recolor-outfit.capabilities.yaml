    goal: |
      探查所有成员的对象、现有菜单、参数、Animator 与 Modular Avatar 配置。plan/0.2 先写 Assets/_Harness/Menu/design.json；plan/0.3 直接核对已接受的 avatar_config 与 menu.tree，冻结工具据此实现。
      plan/0.3：按已接受 avatar_config 的独立组与稳定成员编译；技术 design.json 不得删档、改默认或重定义组。参数 Saved/Synced 独立，绑定不明或厂商写者冲突须阻断并观察，不能凭层顺序覆盖。
      例外：已批准方案 menu.mode 为 preserve 且 outfits 为空时，保留原菜单，不生成衣装选择器或新增控制器。
      此路线由后续冻结工具产生独立菜单层变体并验证未改动；只核对并说明保留意图，不修改现有菜单资产。
      以下直到本 goal 末尾的 menu-design/0.1 生成合同只用于 plan/0.2；plan/0.3 不使用它，直接以已接受的 avatar_config 和 menu.tree 为唯一编译输入。
      plan/0.2 的 design.json 须为 menu-design/0.1：selector 固定为单一 radial 衣装轮盘；component_groups 按用户任务/身体部位聚类，
      每个 control 是跨衣装的一个语义部件开关，targets 列出该部件在各衣装中的精确对象路径。禁止为每套衣装复制同名部件开关，
      禁止用多个 Toggle 切换整套衣装，也禁止“第1页/第2页”机械分页。必须实际修改工程产物。
      结构为：
        {"schema":"menu-design/0.1","selector":{"type":"radial","label":"衣装"},"component_groups":[
          {"id":"layers","label":"穿搭层","controls":[{"id":"outer","label":"外套","parameter":"AVH/Part/outer","default":true,
            "targets":[{"outfit":"衣装 id","objects":["该衣装根下的多个对象路径"],"disable_when_on":["开启时让位关闭的对象路径"],
              "vendor_clips":[{"root":"厂商动画相对的头像对象根或空串","on_clip":"Assets/.../ON.anim","off_clip":"Assets/.../OFF.anim",
                "allow_default_off":["经说明书和单独预览确认应由 ON 动画启用的默认关闭对象完整路径"]}]}]}]}]}
      一个 control 表示用户理解的“部件区开关”，不是一个部件或一个网格。它可以同时控制外套本体、袖子、配套附件，
      或包体、肩带、挂件等组成物；objects 必须列全该区域的组成物，disable_when_on 列出需要联动让位的其他部件，不得按单网格拆开。
      厂商 ON/OFF clip 含收缩键、材质或骨骼曲线时必须登记 vendor_clips，不能退化为只写对象显隐。
      ON clip 若会开启预制体默认关闭的对象，先按备选件处理并排除；只有说明书和单独预览证明它属于该功能时，才写入 allow_default_off。
