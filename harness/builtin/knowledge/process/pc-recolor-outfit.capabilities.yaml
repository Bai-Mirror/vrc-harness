# 能力清单：pc-recolor-outfit 怎样在磁盘上做、怎样测（格式见 kit harness/docs/workflow-runtime.md）
# 每个阶段只写自己的产物目录（连同 Unity 给目录配的同级 .meta）；装配→改色→菜单→优化按 Unity 预制体变体逐层叠加，互不改写上一层的文件。
# 构建在 Git 忽略的 _harness_build/<槽位>/project 副本里做（SDK 构建会顺手改贴图 .meta、lilToon 设置、GraphicsSettings）；
# 构建产物就是副本里的 Assets/_BuildArtifacts/（Unity 沙箱只能写副本本身）。
# 观测一律独立于阶段动作：command 观测在检查沙箱里只读运行；runFile 观测由本阶段 Runtime 控制的 Unity 步骤写出。
schema: capabilities/0.1
process: pc-recolor-outfit
version: "2"

artifacts:
  face_input: {source: {kind: runtime, input: face_input}}
  environment: {paths: [_harness/environment/environment-lock.json, _harness/environment/baseline/], includeIgnored: true}
  assets: {paths: [_harness/intake/]}
  plan: {paths: [_harness/plan/plan.yaml], format: yaml}
  fbx: {paths: [_harness/setup/, _harness/face/observation.json, _harness/face/source-evidence/], listed: _harness/setup/imported.txt}
  face_candidates: {paths: [Assets/_Harness/Face/CandidateSets/, Assets/_Harness/Face/preview-input.json, _harness/face/candidates.json]}
  face: {paths: [Assets/_Harness/Face/Candidates/, Assets/_Harness/Face/Revisions/, Assets/_Harness/Face/Generated/, Assets/_Harness/Face/design.json, _harness/face/output.json, _harness/face/quality.json, _harness/face/eyes.json, _harness/face/head-attachments.json, _harness/face/preview/]}
  outfits: {paths: [Assets/_Harness/Outfit/]}
  materials: {paths: [Assets/_Harness/Recolor/]}
  menu: {paths: [Assets/_Harness/Menu/]}
  build_pre: {paths: [_harness_build/pre/project/Assets/_BuildArtifacts/], includeIgnored: true}
  optimization: {paths: [Assets/_Harness/Optimize/]}
  build: {paths: [_harness_build/final/project/Assets/_BuildArtifacts/], includeIgnored: true}
  delivery_package: {paths: [_harness/delivery/]}

stages:
  environment:
    mode: tool
    network: true
    command: [python3, "{toolRoot}/harness/environment.py", prepare, --recipe, "{toolRoot}/harness/environment-recipe.json", --source, "{templateSource}"]
    allowedWrites: [_harness/environment/]
    maxRetries: 2
  intake:
    mode: tool
    command: [python3, "{toolRoot}/harness/intake.py", --library, "{assetLibrary}", --plan-tool, "{toolRoot}/harness/plan.py"]
    allowedWrites: [_harness/intake/]
  plan:
    mode: provider
    role: executor
    # Raised from 12000 once the stage was told to read the layer table before naming a layer. It was
    # already at 11951 of 12000, and the instruction is the one whose absence let five invented layer
    # paths pass the gate — measured, not assumed: with the instruction added the assembly came to 12002,
    # so fitting it by trimming meant deleting meaning to save two characters (决定记录 D-100).
    # Raised to 21600 for the same reason when the intake gained a fourth conclusion: a bundle whose only
    # payload is a VPM installation entry is now recorded as 项目依赖 and installed by the environment, and
    # the planner has to know it may not be written as unsupported. Without that the planner reverts to the
    # unimportable-source reading this change exists to remove; measured at 21025 with the instruction in.
    # Raised again for the same reason, because 决定记录 D-116 makes the independent material axis part of the
    # plan source contract (`plan.avatar-config` now carries the 独立材质轴 section). 22145 is not a round
    # number because it is the measured minimum: the ten selected items assemble to exactly that many
    # characters of text (20571 of item bodies), and the test compares the assembled text, headers and all,
    # against this declared budget. Knowledge was tightened first and only bought 28 characters — the
    # section was already dense — so the budget moves by the remainder. The compiler itself bills item
    # bodies only, which is why the declared number and the assembled body length differ by roughly a tenth
    # on every stage; that known gap is not changed here.
    # Both raises meet in one plan stage, so the declared budget is the measured minimum of the combined
    # assembly (VPM, D-116 material axes, GUID dependencies and layered-source obligations).
    contextBudgetChars: 23446
    context:
      - context/plan-avatar-v1.md
      - {id: plan.avatar-config, path: context/plan/avatar-config.md, heading: 多组 avatar 配置合同, priority: 1000, required: true, covers: [plan.avatar-config]}
      - {id: plan.material-target, path: context/plan/需求拆解与方案边界.md, heading: 厂商材质选择：服装与完整目录决定槽集合, priority: 950, required: true, covers: [plan.material-target]}
      - {id: common.execution-model.plan, path: context/common/Harness执行模型.md, heading: Harness 正式流程里执行方能做什么, priority: 1000, required: true, covers: [common.execution-model]}
      - {id: plan.requirements.constraint-table, path: context/plan/需求拆解与方案边界.md, heading: 方案阶段：把需求原话收敛成约束表, priority: 900, covers: [plan.constraints]}
      - {id: plan.compat.read-inventory, path: context/plan/挑包与兼容判定.md, heading: 核对清点结果：清点工具的挑包规则与它会错在哪, priority: 850, required: true, covers: [plan.inventory_check]}
      - {id: plan.assets.layered, path: context/plan/挑包与兼容判定.md, heading: 分层源文件：厂商给二次创作者的源稿，决定改色能不能按层做, priority: 830, covers: [plan.layered_sources]}
      - {id: plan.compat.pick-prefab, path: context/plan/挑包与兼容判定.md, heading: 选预制体：认准可穿单品，避开陈列架、附件与非 MA 版, priority: 800, covers: [plan.prefab_pick]}
      - {id: plan.compat.three-tiers, path: context/plan/挑包与兼容判定.md, heading: 兼容判定三档：文件名、开包路径名、骨骼比对, priority: 750, covers: [plan.compat]}
      - {id: plan.requirements.ref-intersection, path: context/plan/需求拆解与方案边界.md, heading: 参考图结论进方案：想往哪走与能往哪走取交集, priority: 700, covers: [plan.aesthetic]}
    agentTools:
      plan_inspect: [python3, "{toolRoot}/harness/plan.py", inspect, --config-tool, "{toolRoot}/harness/avatar_config.py", --project, "{project}"]
      plan_submit: [python3, "{toolRoot}/harness/plan.py", submit, --config-tool, "{toolRoot}/harness/avatar_config.py", --project, "{project}"]
      plan_evidence: [python3, "{toolRoot}/harness/plan.py", evidence, --config-tool, "{toolRoot}/harness/avatar_config.py", --project, "{project}"]
      # Reading the layer table is what makes a layered target checkable rather than plausible. A plan
      # named five layer paths that were all invented and passed its gate; the revision that fixed it did so
      # by reading the tables, but had no declared way to. The dependency is only needed for orders that use
      # layered sources, so it is checked rather than assumed (决定记录 D-100、D-77).
      inspect-layer-source: [python3, "{toolRoot}/harness/layer_source.py", probe]
      check-layer-source-deps: [python3, "{toolRoot}/harness/layer_source.py", doctor]
    maxRetries: 1
    allowedWrites: [_harness/plan/]
    goal: |
      为这个 VRChat 头像工程起草方案，通过受管 plan_submit 提交你自己设计的 {{profile}} 方案到 _harness/plan/plan.yaml（工程根目录下的相对路径）。
      先调用 plan_inspect 取得当前清点绑定的真实预制体候选（按需追加 --item / --offset / --limit 分页），再读 _harness/intake/需求.md。不能把文件名兼容线索当作已完成骨骼适配。
      待骨骼比对实例可选入并登记compatibility: pending_assembly，保留菜单与use/outfit义务。批准只授权试装；setup先观察、outfit按观察补配方实测，失败技术返工，defer不豁免交付。
      Manifest 含 variants 时，每个 variant 是用户已建立的一套衣装方案：保持 id、名称、说明和素材归属；不能把不同方案混成一套，也不能凭空增加方案。
      多组任务用 plan/0.3 和必需上下文中的 avatar_config；禁止混填旧 outfits/default_outfit/menu.selector。以下 plan/0.2 格式保留旧方案兼容：
        schema: plan/0.2
        client_gallery: false            # 本单素材由 Manifest 指定，没有客户选型图鉴
        body: 素体商品号
        body_prefab: plan_inspect 候选里素体那一行的一个完整素体预制体路径（原样照抄）
        outfits:                          # 每套新增服装一项；只改色并保留原装时写 []，不虚构服装
          - id: 小写英文短名
            item: 商品号
            prefab: plan_inspect 中对应衣装/发型/配饰/道具的本体路径（原样照抄；共同穿戴的附件可作为 fixed，但不要误选无关控制器或示例）
            label: 菜单里显示的中文名（≤ 8 个字）
            activation: exclusive        # 缺省 exclusive；共同穿戴的衣服/袜/发/道具写 fixed，固定件不进入互斥轮盘
            shrinkkey_review:             # 检出脚型键或多写者时必填；无风险时可省略
              status: approved               # 仅已有实测写者/宿主证据时填；未探查就省略，交装配阶段量测
              rationale: 为什么键类别、宿主与鞋型匹配
              scenarios: [shoe_on_sock_on, shoe_off_sock_on, barefoot]
        default_outfit: 某 exclusive 的 id # 有 exclusive 必填；全 fixed 或空列表时省略。空列表不能 hide_body_parts
        hide_body_parts:                  # 可省略。构建时永久剔除的素体自带件（关掉并标 EditorOnly，不能按套切换）
          - 素体预制体下的对象路径         # 按厂商开关动画与菜单资产核对后再填，不按名字猜；要按套切换的交给菜单
        unused:                           # 可省略。Manifest 里决定不用的商品，随方案一起由审批人批准；setup 不读取/导入/安装，打包只核对无残留
          - item: 商品号
            reason: unsupported           # unsupported 不支持本素体 / overlap 与已用的件功能重叠 / client_declined 用户明确不要
            note: 一句说明
        deviations:                       # 可省略。订单要求了、但这套素材做不到的项。必须逐条登记，不能只写在 notes 里
                                          # 也不得省略不提：写进 notes 的话没有任何字段或执行器会读它，等于没交代
          - requirement: 订单要什么（原话关键部分）
            why: 为什么做不到（要指得出依据：无分层源／层不存在／网格无该表面／已被代码固定行为覆盖）
            stands_in_for: 当前用什么替代；没有任何替代就写「不做」
            needs_orderer_acceptance: true # 只能是 true。豁免硬要求是订单方的动作，方案不得代它确认
            evidence:                     # 每条理由必须有可读证据；引用核对不等于理由成立或订单方接受
              - {path: _harness/intake/inventory.json, sha256: 文件的SHA256, quote: 文件里逐字存在的一段读数}
        menu:
          mode: assemble                 # preserve 只允许没有 exclusive（全 fixed 可保留厂商菜单）；省略 selector 和 component_policy
          selector: {type: radial, label: 衣装, parameter: AVH/Outfit} # 套间切换只有一个轮盘
          saved: true
          component_policy: horizontal_across_outfits # 同一“鞋/袜/外套”开关横向管理所有衣装对应部件
        recolor:
          targets:                        # 四种目标形态；每项只用一种，可在列表内组合；合计至少一项
            # 形态一：相对改色。按需求原话选部位，整体施加色相/饱和/明度偏移；至多 3 项。
            - part: 部位（hair / eye / outfit:<id>）
              hue_shift: -180～180 的整数
              saturation: 0.5～1.5 的小数
              value: 0.7～1.3 的小数
            # 形态二：按层改色。区域＝厂商分层源文件里的具名层，需要"只改某部件"或受限颜色时用它；至多 8 项。
            - requirement_id: 稳定标识，同一颜色被多处共享时只声明一次色值
              layered: 分层源文件在清点里的 path（必须来自登记的 layered 列表）
              layer: [层路径的逐级名称]      # 名称里的空格属于名称本身，不得去掉首尾空白后匹配
              color: "#RRGGBB"              # 绝对色；硬色不得在候选档里被偏移
              semantics: shade | flat       # 必须显式声明：shade＝保住作者明暗、只承诺层输入值精确；按层软遮罩混合后沿用 NumPy .round()；flat＝区域内不透明核心像素精确等于该色
            # 形态三：选厂商材质。保留材质原件，仅换指定服装内同完整父目录的全部非空槽。
            - requirement_id: 稳定需求标识
              outfit: outfits 中的 id
              material: Assets/ 下受管的厂商材质完整路径
            # 形态四：按网格区域改色。区域＝指定渲染器／子网格上由这些骨骼持有的表面在 UV 上的精确足迹；
            # 需要在一张贴图、一个材质上给两处表面不同颜色时用它（左右异色瞳）：按层路线先输在对应关系上
            # （本单眼睛的两份候选源都过不了证明），而层的名字说的是作者文件里的一块区域，不是网格上的表面；至多 8 项。
            # 骨名取自观察或该素体的知识条目，报不出来源就不要写；写错的名字执行时整条阻断，不会静默失效。
            # 两个区域的足迹完全重叠时（镜像共用 UV 的件）整条阻断；共有的像素两边都不上色，只报出数目。
            # 同一张源贴图只允许一组区域写：两组区域写同一张、或一组区域需要绑到它声明之外的槽位时整条阻断。
            # 每条需求各自一行台账；区域按方案里的骨名重算，记录与方案逐项不符即阻断。
            - requirement_id: 稳定需求标识
              region: {renderer: 观察里的渲染器层级路径, submesh: 子网格序号（从 0 起）, bones: [厂商用来标注这块表面的骨骼名]}
              color: "#RRGGBB"              # 绝对色；硬色不得在候选档里被偏移
              semantics: shade | flat       # 与按层同一套语义判据，逐目标声明；区域 shade 逐通道用 floor(x + 0.5)，按层仍用 NumPy .round()
          candidates: 3                   # 给用户挑的候选档数，3～5；全部目标都是硬色时允许 1 档
        optimization: {mode: optimize}    # 用户要求不优化时必须为 preserve；不增加优化器、不改贴图和骨骼，但仍检查交付约束
        face: {mode: design, intent: 用户脸型目标} # 需要角色捏脸/调整脸型时写design；明确保留原脸时写preserve，不让用户填写键名或参数
        notes: 一两句取舍说明
      你负责原图角色方向和真实素材组合；先写 _harness/plan/draft.json（同字段的 JSON），调用 plan_submit --draft _harness/plan/draft.json；工具会检查来源/结构并写可解析的 YAML 子集。出错按具体字段修正，不猜工具源码。精确骨架、材质槽、形态写者/补偿、隐藏对象等需实际 Unity 的技术事实由后续 setup/face/outfit 阶段观察并施工；此时在 notes 留明确技术目标，不自报验证完成。不要读 Run 内部、仓库源码、旧私有测试/SOP，也不重新遍历整素材库。写好可审批设计后结束；不要为了预先证明尚未施工的全部检查而一直读文件。
  setup:
    mode: provider
    role: executor
    context:
      - context/setup-avatar-v1.md
      - {id: common.execution-model.setup, path: context/common/Harness执行模型.md, heading: Harness 正式流程里执行方能做什么, priority: 1000, required: true, covers: [common.execution-model]}
      - {id: common.discipline.setup, path: context/common/执行纪律.md, priority: 900, covers: [common.evidence, common.prove-cause, common.delivered-state, common.numeric-criteria, common.falsifiable-criteria, common.closeout, common.meta-guid, common.irreversible, common.escalation]}
      - {id: k7.setup.ctx.scene.batch-rollback-path, path: context/common/场景安全与恢复.md, heading: 批量破坏性改动：还原路径先落盘、读回，再动手, priority: 825, covers: [scene.batch-rollback-path]}
      - {id: setup.first-compile, path: context/setup/环境与工具链.md, heading: 新工程首轮编译失败的三个已知成因, priority: 799, covers: [setup.first-compile]}
      - {id: setup.import-guid, path: context/setup/环境与工具链.md, heading: 加包与解包：重启 Unity，保住 GUID, priority: 799, covers: [setup.import-guid]}
      - {id: setup.plugin-compat, path: context/setup/环境与工具链.md, heading: 插件兼容的判据：从依赖范围读天花板，按事件复核, priority: 799, covers: [setup.plugin-compat]}
      - {id: setup.toolchain-baseline, path: context/setup/环境与工具链.md, heading: 工具链基线（成文时）：Unity 2022.3.22f1 与冻结的 VPM 版本, priority: 799, covers: [setup.toolchain-baseline, setup.version-freeze]}
      - {id: setup.unity-instance, path: context/setup/环境与工具链.md, heading: Unity 实例、锁文件与崩溃：不删活锁，不同开一个工程, priority: 799, covers: [setup.unity-instance]}
      - {id: setup.upm-deps, path: context/setup/环境与工具链.md, heading: UPM 侧依赖：散装进 Assets 的厂商包不会解析依赖, priority: 799, covers: [setup.upm-deps]}
      - {id: setup.vpm-project-deps, path: context/setup/环境与工具链.md, heading: 项目可选 VPM 依赖：由清点登记，受管环境安装, priority: 799, covers: [setup.vpm_project_deps]}
      - {id: setup.init.tool-and-checks, path: context/setup/工具链与工程初始化.md, heading: 工程初始化：setup-project 做了什么、你还要核什么, priority: 690, required: true, covers: [setup.init]}
      - {id: setup.unpack.read-report, path: context/setup/解包导入与包落位.md, heading: 导入报告怎么读：冲突、共享 GUID 与未装条目, priority: 685, covers: [setup.import_report]}
      - {id: setup.integrity.five-checks, path: context/setup/完整性检查与GUID.md, heading: 导入后完整性五查, priority: 675, covers: [setup.integrity]}
      - {id: setup.usage.table, path: context/setup/素材应用表与可复现性.md, heading: 素材应用表：行数、用途与三类不用原因, priority: 674, covers: [setup.usage_table]}
      - {id: setup.guid.duplicate-paths, path: context/setup/完整性检查与GUID.md, heading: 一 GUID 多路径：原因与修法, priority: 672, covers: [setup.guid]}
      - {id: setup.unpack.guid-preserving, path: context/setup/解包导入与包落位.md, heading: 解包导入：保 GUID 解包，不拖文件夹、不走导入对话框, priority: 670, covers: [setup.unpack]}
      - {id: setup.unpack.non-importable, path: context/setup/解包导入与包落位.md, heading: 清点结果里「不可导入」的文件要逐个过目, priority: 668, covers: [setup.unpack]}
      - {id: setup.unpack.vpm-zip, path: context/setup/解包导入与包落位.md, heading: 功能插件的 VPM 包必须落在 Packages/, priority: 666, covers: [setup.vpm_zip]}
      - {id: setup.deps.reproducible, path: context/setup/素材应用表与可复现性.md, heading: 依赖可复现性：file:、git 引用与孤儿包, priority: 665, covers: [setup.reproducible]}
      - {id: setup.integrity.broken-refs, path: context/setup/完整性检查与GUID.md, heading: 断链 GUID：扣掉假阳性再判, priority: 664, covers: [setup.integrity]}
      - {id: setup.compile.vendor-asmdef, path: context/setup/工具链与工程初始化.md, heading: 编译判据：厂商独立程序集的错误要单独查, priority: 662, covers: [setup.compile]}
      - {id: setup.toolchain.freeze, path: context/setup/工具链与工程初始化.md, heading: 工具链冻结：单子进行中不升级，按事件重核, priority: 660, covers: [setup.toolchain]}
      - {id: setup.integrity.variant-parent, path: context/setup/完整性检查与GUID.md, heading: 材质变体缺父级：按行数识别、按原 GUID 修, priority: 645, covers: [setup.integrity]}
