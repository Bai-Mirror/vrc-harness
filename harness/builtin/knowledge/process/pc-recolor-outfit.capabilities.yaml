    selectionGate: face_choice
    command: [python3, "{toolRoot}/harness/face.py", execute, --project, "{project}", --sources, "{toolRoot}/harness/unity/Editor/FaceStage.cs", "{toolRoot}/harness/unity/Editor/FaceGeometry.cs", "{toolRoot}/harness/unity/Editor/FaceEyes.cs", "{toolRoot}/harness/unity/Editor/FaceMapping.cs", "{toolRoot}/harness/unity/Editor/FacePreviewStage.cs", "{toolRoot}/harness/unity/Editor/AvhCommon.cs", "{toolRoot}/harness/unity/Editor/LocalOperations.cs", "{toolRoot}/harness/unity/Editor/OutfitStage.cs", "{toolRoot}/harness/unity/Editor/SetupStage.cs", "{toolRoot}/harness/blender_face.py", "{toolRoot}/harness/blender_face_observe.py", "{toolRoot}/harness/blender_face_common.py", "{toolRoot}/harness/blender_face_transfer.py", "{toolRoot}/harness/blender_face_mapping.py"]
