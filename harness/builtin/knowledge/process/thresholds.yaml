  # ---- 装配后的可见重叠（D-138）：量法见 harness/unity/Editor/OutfitVisibility.cs ----
  # 标定数据：车道 OV1 在头像 A 的装配产物上扫全部 987 对（77 个可见渲染器），
  # 0.1 mm 带 + 1 cm² 阈值触发 20 对，全部是真实同位叠放（丝袜四副本 6 对 + 腿部四层 14 对），误报 0；
  # 阈值降到 0.1 cm² 会多出 22 对贴身正常穿着。对照见 OV1 报告 §4「阈值扫描」。
  overlap_contact_epsilon_mm:
    value: 0.1
    unit: mm
    maturity: tested
    applies_to: {}
    source: "车道报告 lanes/reports/OV1-stacked-meshes.md:318@OV1（A 上 987 对扫描）"
    kind: spec
    asserted_by: compile:harness-core
    verification: [{kind: harness-regression, ref: test/outfit-visibility-unity.test.ts}]
  overlap_contact_min_cm2:
    value: 1.0
    unit: cm2
    maturity: tested
    applies_to: {}
    source: "车道报告 lanes/reports/OV1-stacked-meshes.md:331@OV1（≥1 cm² 触发 20 对、误报 0）"
    kind: spec
    asserted_by: compile:harness-core
    verification: [{kind: harness-regression, ref: test/outfit-visibility-unity.test.ts}]
  # ---- 衣物之间看得见的互穿（D-143，GI1）：量法见 harness/unity/Editor/OutfitVisibility.cs ----
  # 最小量＝一对里层件被渲图确认的顶点数下限。标定在头像 A 的装配产物上做（GI1 车道报告）：
  # 目标对 Dress_Skirt↔Coat 确认数远高于此；缝线/边缘零星接触的对确认数为个位数。
  visible_interpenetration_min_vertices:
    value: 8
    unit: vertices
    maturity: tested
    applies_to: {}
    source: "车道报告 lanes/reports/GI1-visible-interpenetration.md（A 上各对校准读数）"
    kind: spec
    asserted_by: compile:harness-core
    verification: [{kind: harness-regression, ref: test/outfit-visibility-unity.test.ts}]
  # 护栏（不是过滤）：订单方把「算不算穿模」交给 AI 按准则判断，Runtime 只挡明显越界。两个界都取宽松值，
  # 故意不按某个头像调到刚好通过——白裙成片翻出的那一对越界（确认顶点数远超 128），
  # 全身丝袜与靴子／外套那种薄相交在界内（十几个确认点、真实深度在 2 mm 以内）。
  visible_interpenetration_guard_vertices:
    value: 128
    unit: vertices
    maturity: tested
    applies_to: {}
    source: "车道报告 lanes/reports/GI1-visible-interpenetration.md（护栏取值与 A 上的逐对读数）"
    kind: spec
    asserted_by: compile:harness-core
    verification: [{kind: harness-regression, ref: test/outfit-visibility-unity.test.ts}]
  # 穿出深度的量程（GI2）：depth_max_mm 是「确认顶点到外层最近三角面的带符号距离」，是局部表面间距，不是
  # 「穿过了面料」的证明。把量程放宽到 3 mm 曾在 A 上实测：外套下摆以下的袜腿、靴筒内壁都读成 2.7–3.0 mm 的
  # 「穿出」，阻断对数从 0 涨到 23；所以量程保持在与层序普查同宽的 1 mm。最深只到量程上界的对记
  # depth_at_least=true，证据写「至少 X mm」，不当实测值；这种对不能 accept（深度没被量到护栏以内）。真正的
  # 深度护栏需要新的「面料穿越＋表面归属」观测，仍是未完成项（见车道报告 GI2 的待决）。不得按某个头像调到刚好通过。
  visible_interpenetration_poke_reach_mm:
    value: 1.0
    unit: mm
    maturity: tested
    applies_to: {}
    source: "车道报告 lanes/reports/GI2-depth-and-regression.md（A 上逐对的真实深度分布）"
    kind: spec
    asserted_by: compile:harness-core
    verification: [{kind: harness-regression, ref: test/outfit-visibility-unity.test.ts}]
  visible_interpenetration_guard_depth_mm:
    value: 2.0
    unit: mm
    maturity: tested
    applies_to: {}
    source: "车道报告 lanes/reports/GI1-visible-interpenetration.md（护栏取值与 A 上的逐对深度分布）"
    kind: spec
    asserted_by: compile:harness-core
    verification: [{kind: harness-regression, ref: test/outfit-visibility-unity.test.ts}]
