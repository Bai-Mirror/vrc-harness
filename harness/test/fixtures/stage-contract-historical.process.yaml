  - id: plan_group_contract_valid
    observe: plan.source
    on: plan
    scope: edit
    when: plan.avatar_config
    rule: plan_group_contract_valid == true
    severity: blocking
    maturity: accepted
    kind: spec
    asserted_by: compile:avatar-config
    source: 决定记录/D-107; L12 task authorization (2026-10-04)
    verification:
      - kind: human-approval
        ref: "L12 task authorization: implement run-D3-final.md (2026-10-04)"
gates:
  - id: face_appearance
    kind: approve
    review: face-output
    when: plan.face.mode == "design"
    binds: face
    source: docs/zh/设计/2-功能模块/09_交互捏脸与后台制作.md
  - id: face_choice
    kind: choose
    selection: face-candidate
    binds: face_candidates
    source: docs/zh/设计/2-功能模块/09_交互捏脸与后台制作.md
  - id: material_gap_confirm
    kind: approve
    binds: assets
    source: 开发工具/SOP/10_接单建档.md:119@f6721fea
  - id: plan_approval
    kind: approve
    binds: plan
    source: 开发工具/SOP/00_总表/人工卡口与素材来源.md:20@f6721fea
milestones: []
