    asserted_by: compile:legacy
  - id: material_inheritance_ok
    observe: assets.validate
    on: fbx
    scope: edit
    rule: min_liltoon_material_lines >= t.liltoon_material_min_lines
    severity: advisory
    maturity: candidate
    source: 开发工具/SOP/20_素材清点导入.md:127@988b9847
  - id: guid_unique
    observe: assets.validate
    on: fbx
    scope: edit
